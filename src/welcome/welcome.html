<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuickLinker</title>
    <link rel="stylesheet" href="welcome.css">
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>

<header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">+</span><span>QuickLinker</span></div>
    <div class="tools">
        <button type="button" class="motion-btn" id="motionBtn">
            <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
            <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 4l13 8-13 8z"/></svg>
            <span></span>
        </button>
        <label class="select">
            <span class="sr" data-i18n="lang_label"></span>
            <select id="langSel">
                <option value="auto" data-i18n="lang_auto">Auto</option>
                <option value="zh-TW">繁體中文</option>
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>
        </label>
        <div class="seg3" role="group" aria-labelledby="themeLbl">
            <span class="sr" id="themeLbl" data-i18n="theme_label"></span>
            <button type="button" data-theme-mode="auto" data-i18n-title="theme_auto" aria-label="auto">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            </button>
            <button type="button" data-theme-mode="light" data-i18n-title="theme_light" aria-label="light">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button type="button" data-theme-mode="dark" data-i18n-title="theme_dark" aria-label="dark">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
            </button>
        </div>
    </div>
</header>

<nav class="stepper" aria-label="steps"><ol id="stepper"></ol></nav>

<main class="deck">

    <!-- 1 認識 -->
    <section class="step" data-step="1" aria-labelledby="t1">
        <header class="shead">
            <p class="eyebrow"></p>
            <h1 id="t1" data-i18n="s1_title"></h1>
            <p class="lead" data-i18n="s1_desc"></p>
        </header>
        <div class="bench">
            <div class="mock" id="sceneMock">
                <div class="mock-bar"><b></b><b></b><b></b><span class="addr" data-i18n="scene_url"></span></div>
                <div class="page">
                    <div class="skel w60"></div><div class="skel w90"></div><div class="skel w40"></div>
                    <h3 class="code" id="sceneCode">IPZZ-914</h3>
                    <div class="skel w90"></div><div class="skel w75"></div><div class="skel w50"></div>
                </div>
                <div class="toast" id="sceneToast"></div>
                <div class="fl-host"></div>
                <div class="cursor" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 3l15 7-6.5 1.8L10 18z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
            </div>
            <ol class="phases" id="scenePhases">
                <li><span class="dot"></span><div><strong data-i18n="s1_p1"></strong><small data-i18n="s1_p1d"></small></div></li>
                <li><span class="dot"></span><div><strong data-i18n="s1_p2"></strong><small data-i18n="s1_p2d"></small></div></li>
                <li><span class="dot"></span><div><strong data-i18n="s1_p3"></strong><small data-i18n="s1_p3d"></small></div></li>
            </ol>
            <button type="button" class="ghost-btn" id="sceneReplay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg><span data-i18n="s1_replay"></span></button>
        </div>
        <div class="nav">
            <button type="button" class="btn primary" data-nav="next" data-i18n="nav_begin"></button>
            <button type="button" class="skip" data-nav="skip" data-i18n="nav_skip"></button>
        </div>
    </section>

    <!-- 2 浮動按鈕 -->
    <section class="step" data-step="2" aria-labelledby="t2">
        <header class="shead">
            <p class="eyebrow"></p>
            <h1 id="t2" data-i18n="s2_title"></h1>
            <p class="lead" data-i18n="s2_desc"></p>
        </header>
        <div class="bench">
            <div class="mock tall" id="tryMock">
                <div class="mock-bar"><b></b><b></b><b></b><span class="addr" data-i18n="scene_url"></span></div>
                <div class="page">
                    <div class="skel w60"></div><div class="skel w90"></div><div class="skel w40"></div>
                    <h3 class="code static">IPZZ-914</h3>
                    <div class="skel w90"></div><div class="skel w75"></div><div class="skel w50"></div><div class="skel w90"></div>
                </div>
                <p class="hint-chip" id="tryHint" data-i18n="s2_hint"></p>
                <div class="fl-host"></div>
            </div>
            <div class="legend">
                <span><i class="lg probe"></i><em data-i18n="s2_legend_probe"></em></span>
                <span><i class="lg ok"></i><em data-i18n="s2_legend_ok"></em></span>
                <span><i class="lg gone"></i><em data-i18n="s2_legend_gone"></em></span>
            </div>
            <p class="summary" id="trySummary" aria-live="polite"></p>
            <button type="button" class="ghost-btn" id="tryReplay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg><span data-i18n="s2_replay"></span></button>
        </div>
        <div class="nav">
            <button type="button" class="btn" data-nav="prev" data-i18n="nav_back"></button>
            <button type="button" class="btn primary" data-nav="next" data-i18n="nav_next"></button>
            <button type="button" class="skip" data-nav="skip" data-i18n="nav_skip"></button>
        </div>
    </section>

    <!-- 3 搜尋網址 / token 實驗室 -->
    <section class="step" data-step="3" aria-labelledby="t3">
        <header class="shead">
            <p class="eyebrow"></p>
            <h1 id="t3" data-i18n="s3_title"></h1>
            <p class="lead" data-i18n="s3_desc"></p>
        </header>
        <div class="bench lab">
            <div class="lab-in">
                <label class="field">
                    <span data-i18n="s3_code"></span>
                    <input id="labCode" type="text" value="IPZZ-914" spellcheck="false" autocomplete="off" maxlength="24">
                </label>
                <div class="chips" aria-label="examples" id="labExamples">
                    <span class="chips-l" data-i18n="s3_examples"></span>
                    <button type="button" class="chip-btn" data-code="IPZZ-914">IPZZ-914</button>
                    <button type="button" class="chip-btn" data-code="PRED-820">PRED-820</button>
                    <button type="button" class="chip-btn" data-code="FC2-PPV-1234567">FC2-PPV-1234567</button>
                </div>
                <label class="field">
                    <span data-i18n="s3_template"></span>
                    <input id="labTpl" type="text" value="https://javtrailers.com/video/{dmm}" spellcheck="false" autocomplete="off">
                </label>
                <div class="out">
                    <span class="out-l" data-i18n="s3_result"></span>
                    <code id="labOut" aria-live="polite"></code>
                </div>
            </div>
            <div class="lab-tab" role="table" aria-label="tokens">
                <p class="tip" data-i18n="s3_tip"></p>
                <button type="button" class="tok-row" data-token="{}"><code class="tok">{}</code><span data-i18n="tok_raw"></span><b class="val" data-val="raw"></b></button>
                <button type="button" class="tok-row" data-token="{lower}"><code class="tok">{lower}</code><span data-i18n="tok_lower"></span><b class="val" data-val="lower"></b></button>
                <button type="button" class="tok-row" data-token="{upper}"><code class="tok">{upper}</code><span data-i18n="tok_upper"></span><b class="val" data-val="upper"></b></button>
                <button type="button" class="tok-row" data-token="{nodash}"><code class="tok">{nodash}</code><span data-i18n="tok_nodash"></span><b class="val" data-val="nodash"></b></button>
                <button type="button" class="tok-row" data-token="{dmm}"><code class="tok">{dmm}</code><span><span data-i18n="tok_dmm"></span><small data-i18n="s3_fit_dmm"></small></span><b class="val" data-val="dmm"></b></button>
            </div>
        </div>
        <div class="nav">
            <button type="button" class="btn" data-nav="prev" data-i18n="nav_back"></button>
            <button type="button" class="btn primary" data-nav="next" data-i18n="nav_next"></button>
            <button type="button" class="skip" data-nav="skip" data-i18n="nav_skip"></button>
        </div>
    </section>

    <!-- 4 右鍵選單 -->
    <section class="step" data-step="4" aria-labelledby="t4">
        <header class="shead">
            <p class="eyebrow"></p>
            <h1 id="t4" data-i18n="s4_title"></h1>
            <p class="lead" data-i18n="s4_desc"></p>
        </header>
        <div class="bench">
            <div class="mock tall" id="ctxMock">
                <div class="mock-bar"><b></b><b></b><b></b><span class="addr" data-i18n="scene_url"></span></div>
                <div class="page">
                    <div class="skel w60"></div><div class="skel w90"></div>
                    <p class="sample" id="ctxSample"></p>
                    <div class="skel w75"></div><div class="skel w50"></div>
                </div>
                <p class="hint-chip" data-i18n="s4_try"></p>
                <div class="ctx" id="ctxMenu" role="menu" hidden></div>
                <div class="toast" id="ctxToast"></div>
                <div class="cursor" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 3l15 7-6.5 1.8L10 18z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
            </div>
            <button type="button" class="ghost-btn" id="ctxAuto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg><span data-i18n="s4_auto"></span></button>
        </div>
        <div class="nav">
            <button type="button" class="btn" data-nav="prev" data-i18n="nav_back"></button>
            <button type="button" class="btn primary" data-nav="next" data-i18n="nav_next"></button>
            <button type="button" class="skip" data-nav="skip" data-i18n="nav_skip"></button>
        </div>
    </section>

    <!-- 5 偏好設定 -->
    <section class="step" data-step="5" aria-labelledby="t5">
        <header class="shead">
            <p class="eyebrow"></p>
            <h1 id="t5" data-i18n="s5_title"></h1>
            <p class="lead" data-i18n="s5_desc"></p>
        </header>
        <div class="bench prefs">
            <div class="group">
                <div class="group-h"><h2 data-i18n="scan_title"></h2><button type="button" class="ghost-btn sm" id="raceReplay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg><span data-i18n="scan_replay"></span></button></div>
                <div class="scan-cards" role="radiogroup" aria-labelledby="scanLbl">
                    <button type="button" class="scan-card" role="radio" data-scan="bestMatch" aria-checked="false">
                        <span class="radio" aria-hidden="true"></span>
                        <strong data-i18n="scan_best"></strong><small data-i18n="scan_best_d"></small>
                        <div class="race" data-race="bestMatch"></div>
                    </button>
                    <button type="button" class="scan-card" role="radio" data-scan="fullScan" aria-checked="false">
                        <span class="radio" aria-hidden="true"></span>
                        <strong data-i18n="scan_full"></strong><small data-i18n="scan_full_d"></small>
                        <div class="race" data-race="fullScan"></div>
                    </button>
                </div>
            </div>
            <div class="group">
                <div class="group-h"><h2 data-i18n="pref_title"></h2><span class="saved" id="savedTag" data-i18n="saved" aria-live="polite"></span></div>
                <label class="pref"><span><strong data-i18n="pref_exclude"></strong><small data-i18n="pref_exclude_d"></small></span><input type="checkbox" class="switch" data-pref="excludeCurrentSite" role="switch"></label>
                <label class="pref"><span><strong data-i18n="pref_close"></strong><small data-i18n="pref_close_d"></small></span><input type="checkbox" class="switch" data-pref="closeOriginalTab" role="switch"></label>
                <label class="pref"><span><strong data-i18n="pref_float"></strong><small data-i18n="pref_float_d"></small></span><input type="checkbox" class="switch" data-pref="showFloatingButton" role="switch"></label>
                <label class="pref"><span><strong data-i18n="pref_cache"></strong><small data-i18n="pref_cache_d"></small></span><input type="checkbox" class="switch" data-pref="enableCache" role="switch"></label>
            </div>
        </div>
        <div class="nav">
            <button type="button" class="btn" data-nav="prev" data-i18n="nav_back"></button>
            <button type="button" class="btn primary" data-nav="next" data-i18n="nav_next"></button>
            <button type="button" class="skip" data-nav="skip" data-i18n="nav_skip"></button>
        </div>
    </section>

    <!-- 6 完成 -->
    <section class="step" data-step="6" aria-labelledby="t6">
        <header class="shead">
            <p class="eyebrow"></p>
            <h1 id="t6" data-i18n="s6_title"></h1>
            <p class="lead" data-i18n="s6_desc"></p>
        </header>
        <div class="bench done">
            <ul class="checklist">
                <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="s6_c1"></span></li>
                <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="s6_c2"></span></li>
                <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="s6_c3"></span></li>
            </ul>
        </div>
        <div class="nav">
            <button type="button" class="btn" data-nav="prev" data-i18n="nav_back"></button>
            <button type="button" class="btn" id="openOptions" data-i18n="s6_options"></button>
            <button type="button" class="btn primary" data-nav="finish" data-i18n="s6_start"></button>
        </div>
    </section>

</main>

<script src="welcome-i18n.js"></script>
<script src="welcome.js"></script>
</body>
</html>
